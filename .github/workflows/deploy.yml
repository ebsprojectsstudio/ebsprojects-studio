name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Permet aussi de relancer une mise en ligne à la main depuis l'onglet Actions.
  workflow_dispatch:

# Autorisations minimales nécessaires au déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois ; les pushs rapprochés attendent leur tour
# plutôt que de se doubler.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Construire le site
        run: npm run build
        # Servi à la racine de ebsprojects.studio (voir public/CNAME) :
        # les valeurs par défaut d'astro.config.mjs s'appliquent.

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
